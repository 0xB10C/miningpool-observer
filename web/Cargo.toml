[package]
name = "miningpool-observer-web"
version = "0.1.0"
authors = ["0xb10c <0xb10c@gmail.com>"]
edition = "2018"

[dependencies]

miningpool_observer_shared = { path="../shared" }

log = "0.4"
simple_logger = "5.2.0"

actix-http = "3"
actix-web = "4"
actix-files = "0.7"

serde = "1"
hex = "0.4"

tera = "1.7"

# svg to png image rendering
# usvg and tiny-skia are re-exported by resvg (as resvg::usvg / resvg::tiny_skia)
# and used through that re-export so their versions can't drift out of sync with resvg.
resvg = "0.47.0"


[features]
# Treat warnings as a build error.
strict = []

[build-dependencies]
serde = "1"
serde_json = "1"
