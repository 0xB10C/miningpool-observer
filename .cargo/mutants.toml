# Configuration for cargo-mutants (https://mutants.rs).
#
# Run with:   cargo mutants -p <crate>
# See docs/development.md for details.

# Code that needs a running Bitcoin Core node, a PostgreSQL database, or runs
# forever can't be exercised by the default `cargo test` run. Mutating it only
# produces noise, so it is skipped.
exclude_globs = [
    "daemon/src/db.rs",
    "daemon/src/metrics.rs",
    "web/src/db.rs",
    "shared/src/db_pool.rs",
    "shared/src/schema.rs",
]

exclude_re = [
    # daemon: startup, RPC loops, and background threads
    "daemon/src/main.rs.*fn main\\b",
    "daemon/src/main.rs.*fn main_loop",
    "daemon/src/main.rs.*fn process\\b",
    "daemon/src/main.rs.*fn startup_db_mirgation",
    "daemon/src/main.rs.*fn log_template_infos",
    "daemon/src/main.rs.*fn scantxoutset_sanctioned_tx",
    "daemon/src/main.rs.*fn start_.*_thread",
    "daemon/src/main.rs.*fn retag_transactions",
    "daemon/src/main.rs.*fn update_sanctioned_addresses",
    "daemon/src/main.rs.*fn load_pool_identification_dataset",
    "daemon/src/main.rs.*fn mempool_age_seconds",
    "daemon/src/processing.rs.*fn log_processing_error",
    # web: startup and request handlers that need a database
    "web/src/main.rs.*fn main\\b",
    "web/src/handler.rs",
    "web/src/ogimage.rs.*fn ogimage_",
    # shared: file loading wrappers around the parsers
    "shared/src/config.rs.*fn load_daemon_config",
    "shared/src/config.rs.*fn load_web_config",
    "shared/src/prometheus_metric_server.rs.*fn start_http_server",
]

# Each mutant is built and tested from scratch, so give it some headroom.
minimum_test_timeout = 120.0
